name: omniroute
kind: model-provider
version: 1.1.0
description: OmniRoute — free OpenAI-compatible multi-provider AI gateway
author: bacnh85
license: MIT
homepage: https://github.com/bacnh85/hermes-plugins
tags: [provider, model-provider, omniroute, gateway]
requires_env:
  - name: OMNIROUTE_API_KEY
    description: "OmniRoute API key (Bearer token)"
    url: "https://omniroute.online/"
    secret: true
  - name: OMNIROUTE_BASE_URL
    description: "Base URL (Enter for hosted default https://omniroute.online/v1; self-host: http://localhost:20128/v1)"
    url: "https://omniroute.online/"
    secret: false